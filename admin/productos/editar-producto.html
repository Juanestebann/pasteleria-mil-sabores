<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto | Pastelería Mil Sabores</title>
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/admin-editar-producto.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="../../js/admin/editar-producto.js" defer></script>
</head>
<body>
    <section id="admin-aplicacion">
        <aside id="menu-admin">
            <section id="marca-admin">
                <h1>Pastelería<span>Mil Sabores</span></h1>
                <p>Panel de administración</p>
            </section>
            <nav id="navegacion-admin">
                <a href="../index.html">Inicio</a>
                <a href="productos.html" class="opcion-activa">Productos</a>
                <a href="../usuarios/usuarios.html"> Usuarios</a>
                <a href="../../index.html">Volver a la tienda</a>
            </nav>
        </aside>
        <section id="contenido-admin">

            <header id="cabecera-admin">
                <section>
                    <h2>Panel de administración</h2>

                    <p>Bienvenido,<span id="nombre-usuario-admin"></span> </p>
                </section>
                <section id="sesion-admin">
                    <span id="rol-usuario-admin"></span>

                    <button id="cerrar-sesion-admin" type="button">
                        Cerrar Sesión
                    </button>
                </section>

            </header>

            <main id="principal-admin">

                <section id="editar-producto-presentacion">

                    <section>
                        <h2>Editar producto</h2>

                        <p>
                            Modifica la información del producto seleccionado.
                        </p>
                    </section>

                    <a id="volver-productos" href="productos.html">
                        <i class="fa-solid fa-arrow-left"></i>
                        Volver a productos
                    </a>

                </section>

                <form id="formulario-editar-producto">

                    <section class="campo-formulario">
                        <label for="codigo">
                            Código
                        </label>
                        <input
                            type="text"
                            id="codigo"
                            placeholder="Ejemplo: TC003"
                            readonly>
                        <p class="mensaje-error" id="error-codigo"></p>
                    </section>

                    <section class="campo-formulario">
                        <label for="nombre">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            placeholder="Nombre del producto">

                        <p class="mensaje-error" id="error-nombre"></p>
                    </section>

                    <section class="campo-formulario">
                        <label for="precio">Precio</label>
                        <input
                            type="number"
                            id="precio"
                            min="1"
                            placeholder="Ejemplo: 45000">

                        <p class="mensaje-error" id="error-precio"></p>
                    </section>

                    <section class="campo-formulario">
                        <label for="categoria">
                            Categoría
                        </label>

                        <select id="categoria">
                            <option value="">Seleccione una categoría</option>
                            <option value="cuadradas">Tortas Cuadradas</option>
                            <option value="circulares"> Tortas Circulares </option>
                            <option value="individuales"> Postres Individuales</option>
                            <option value="sin-azucar">Sin Azúcar</option>
                            <option value="tradicional">Pastelería Tradicional </option>
                            <option value="sin-gluten">Sin Gluten</option>
                            <option value="veganos">Veganos</option>
                            <option value="especiales">Tortas Especiales</option>

                        </select>

                        <p class="mensaje-error" id="error-categoria"></p>
                    </section>

                    <section class="campo-formulario">
                        <label for="stock">
                            Stock
                        </label>

                        <input
                            type="number"
                            id="stock"
                            min="0"
                            placeholder="Ejemplo: 10">

                        <p class="mensaje-error" id="error-stock"></p>
                    </section>

                    <section class="campo-formulario">
                        <label for="stock-critico">
                            Stock crítico
                        </label>

                        <input
                            type="number"
                            id="stock-critico"
                            min="0"
                            placeholder="Ejemplo: 3">

                        <p class="mensaje-error" id="error-stock-critico"></p>
                    </section>

                    <section class="campo-formulario campo-completo">
                        <label for="imagen">
                            Imagen
                        </label>

                        <input
                            type="text"
                            id="imagen"
                            placeholder="../img/Nombre imagen.png">

                        <p class="mensaje-error" id="error-imagen"></p>
                    </section>

                    <section class="campo-formulario campo-completo">
                        <label for="descripcion">
                            Descripción
                        </label>

                        <textarea
                            id="descripcion"
                            placeholder="Descripción del producto"></textarea>

                        <p class="mensaje-error" id="error-descripcion"></p>
                    </section>

                    <p id="mensaje-producto"></p>

                    <section id="acciones-formulario">

                        <button
                            id="guardar-cambios-producto"
                            type="submit">

                            <i class="fa-solid fa-floppy-disk"></i>
                            Guardar cambios
                        </button>

                        <a href="productos.html"> Cancelar</a>
                    </section>
                </form>
            </main>
        </section>
    </section>
</body>
</html>
